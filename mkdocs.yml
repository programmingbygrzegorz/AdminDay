site_name: AdminDay
site_description: IT Operations Journal – real-world IT administration cases, diagnostics and automation
site_url: https://programmingbygrzegorz.github.io/AdminDay/
repo_url: https://github.com/programmingbygrzegorz/AdminDay
repo_name: programmingbygrzegorz/AdminDay
edit_uri: edit/main/docs/
copyright: AdminDay · dane w dokumentach są zanonimizowane / all case data is anonymized

theme:
  name: material
  language: pl
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny / Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tryb ciemny / Dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/console-network

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pl
          default: true
          name: Polski
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Start: Home
            Dziennik pracy: Workdays
            Incydenty: Incidents
            O projekcie: About
            Zasady anonimizacji: Anonymization rules

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs/assets/charts]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: index.md
  - Dziennik pracy:
      - workdays/index.md
      - workdays/day-001-cms-db-saturation.md
  - Incydenty:
      - incidents/index.md
  - O projekcie:
      - Zasady anonimizacji: about/anonymization.md
